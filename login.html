<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Imperial Roleplay</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(0, 255, 179, 0.05) 0%, #0d0d0d 70%);
        }
        .login-box {
            width: 100%;
            max-width: 450px;
            padding: 50px;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></canvas>

    <div class="login-container">
        <div class="login-box glass">
            <a href="index.html">
                <img src="assets/logo.png" alt="Logo" style="height: 60px; margin-bottom: 30px;">
            </a>
            <h2 style="margin-bottom: 10px;">Velkommen tilbage</h2>
            <p style="color: var(--text-gray); margin-bottom: 40px;">Log ind for at se din profil og ansøgninger.</p>

            <a href="#" class="btn btn-discord" style="width: 100%; padding: 15px; margin-bottom: 25px; font-size: 1rem; justify-content: center;">
                <i class="ph ph-discord-logo"></i> Log ind med Discord
            </a>

            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
                <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
                <span style="color: var(--text-gray); font-size: 0.8rem;">ELLER</span>
                <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
            </div>

            <form action="#">
                <div class="form-group" style="text-align: left;">
                    <label>Brugernavn</label>
                    <input type="text" placeholder="Indtast dit brugernavn...">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Adgangskode</label>
                    <input type="password" placeholder="Indtast din adgangskode...">
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <label style="display: flex; gap: 8px; align-items: center; font-size: 0.85rem; color: var(--text-gray); cursor: pointer;">
                        <input type="checkbox"> Husk mig
                    </label>
                    <a href="#" style="font-size: 0.85rem; color: var(--primary);">Glemt adgangskode?</a>
                </div>

                <button class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1rem; justify-content: center;">Log Ind</button>
            </form>

            <p style="margin-top: 30px; font-size: 0.9rem; color: var(--text-gray);">
                Har du ikke en konto? <a href="#" style="color: var(--primary);">Opret dig her</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
